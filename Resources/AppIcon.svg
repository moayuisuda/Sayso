<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Sayso 应用图标源文件，所有平台图标都由 scripts/render-icons.swift 从这里生成。
    画布按 macOS 图标网格：824×824 主体居中，四周留 100 给系统阴影；Windows 图标只裁取主体。
    主体把名字拆成「Say / so.」两行，点出「说出来」的本意。
    字形取自思源宋体 Bold（Source Han Serif CN，SIL OFL 1.1），已转为路径内嵌，渲染不依赖本机字体。
  -->
  <defs>
    <!-- 主题色 Indigo #3F51B5 自上而下压暗，保持沉稳。 -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3F51B5"/>
      <stop offset="1" stop-color="#1F2A6E"/>
    </linearGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#body)"/>
  <!-- 顶部极细高光，勾出玻璃般的边缘。 -->
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3"/>

