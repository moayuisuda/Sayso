# 推送 v* tag 时构建 macOS 与 Windows 安装包并发布到 GitHub Releases。
# 版本号取自 tag（v1.2.0 → 1.2.0），写入 Info.plist 与 Sayso.exe。
# runner 镜像已预装 Rust、Xcode 26 与 .NET 10 SDK。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - run: cargo test --manifest-path core/Cargo.toml --workspace --locked

  # 用 Developer ID Application 证书签名并经 Apple 公证，下载后可直接打开。
  # CSC_LINK 为 base64 编码的 .p12 证书；APPLE_* 用于 notarytool 提交公证。
  macos:
    needs: test
    runs-on: macos-26
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v6
      # 证书导入临时钥匙串，并把其中的 Developer ID 身份交给 bundle-app.sh。
      - name: Import signing certificate
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/"Developer ID Application:/ {print $2; exit}')"
          [ -n "$IDENTITY" ] || { echo "::error::CSC_LINK 中没有 Developer ID Application 证书"; exit 1; }
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Build Sayso.app
        run: VERSION="${GITHUB_REF_NAME#v}" bash scripts/bundle-app.sh
      # 公证未通过时输出 Apple 返回的日志；通过后把公证票据钉进 app，离线也能通过校验。
      - name: Notarize
        run: |
          ditto -c -k --keepParent build/Sayso.app "$RUNNER_TEMP/notarize.zip"
          RESULT="$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --output-format json)"
          echo "$RESULT"
          if [ "$(plutil -extract status raw - <<< "$RESULT")" != "Accepted" ]; then
            xcrun notarytool log "$(plutil -extract id raw - <<< "$RESULT")" \
              --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID"
            exit 1
          fi
          xcrun stapler staple build/Sayso.app
      - name: Validate signing and notarization
        run: |
          codesign --verify --deep --strict --verbose=2 build/Sayso.app
          spctl -a -vvv --type execute build/Sayso.app
          xcrun stapler validate build/Sayso.app
      - name: Package
        run: ditto -c -k --keepParent build/Sayso.app "Sayso-${GITHUB_REF_NAME#v}-macOS-arm64.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: macos
          path: Sayso-*-macOS-arm64.zip

  windows:
    needs: test
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - name: Install Inno Setup
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $installer
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne '8A5A6711C3766A6E5FB74F280BA0E3551E719CE94538D901FDBD1F8F9920B3F0') {
            throw 'Inno Setup 校验失败。'
          }
          $process = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode) { throw "Inno Setup 安装失败：$($process.ExitCode)" }
      - name: Build
        run: ./scripts/build-windows.ps1 -Version ($env:GITHUB_REF_NAME.TrimStart('v'))
      - name: Test installer lifecycle
        run: ./scripts/test-windows-installer.ps1 -Installer (Get-Item build/installers/*-Setup.exe).FullName
      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: build/installers/Sayso-*-windows-x64-Setup.exe
          if-no-files-found: error

  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Sayso-*.zip Sayso-*-Setup.exe --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
