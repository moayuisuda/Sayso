[package]
name = "sayso-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
uniffi = { workspace = true }
async-trait = "0.1"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rquickjs = { version = "0.14", features = ["futures", "macro", "loader", "parallel"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "multipart", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
log = { version = "0.4", features = ["std"] }

[dev-dependencies]
tempfile = "3"
